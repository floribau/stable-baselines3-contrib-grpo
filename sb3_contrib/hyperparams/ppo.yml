# Tuned for optimal rewards after 20_000 timesteps
CartPole-v1:
  n_envs: 8
  n_timesteps: !!float 1e5
  policy: 'MlpPolicy'
  n_steps: 64
  # batch_size: 256
  batch_size: 16
  # gae_lambda: 0.8
  gae_lambda: 0.97
  # gamma: 0.98
  gamma: 0.99
  # n_epochs: 20
  n_epochs: 5
  # ent_coef: 0.0
  ent_coef: 0.00035
  # learning_rate: lin_0.001
  learning_rate: 0.001
  # clip_range: lin_0.2
  clip_range: 0.4
  policy_kwargs: "dict(activation_fn=nn.ReLU, net_arch=dict(pi=[64, 64], vf=[64, 64]))"

MountainCar-v0:
  normalize: true
  n_envs: 16
  n_timesteps: !!float 1e6
  policy: 'MlpPolicy'
  n_steps: 16
  gae_lambda: 0.98
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0