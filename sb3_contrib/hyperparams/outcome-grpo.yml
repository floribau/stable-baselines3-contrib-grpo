CartPole-v1:
  n_timesteps: !!float 1e5
  policy: 'GroupPolicy'
  group_rollout_buffer_class: 'OutcomeGroupBuffer'
  # group_size: 16
  group_size: 8
  # n_epochs: 20
  n_epochs: 10
  # ent_coef: 0.0
  ent_coef: !!float 4e-07
  # learning_rate: lin_0.001
  learning_rate: 0.0018
  # clip_range: lin_0.2
  clip_range: 0.4
  max_grad_norm: 1.443
  policy_kwargs: "dict(activation_fn=nn.ELU, net_arch=dict(pi=[64, 64]))"

MountainCar-v0:
  normalize: true
  n_timesteps: !!float 1e6
  policy: 'GroupPolicy'
  group_rollout_buffer_class: 'OutcomeGroupBuffer'
  group_size: 16
  n_epochs: 10